<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">ATLAS project icon</title>
  <desc id="description">Four tilted research tiles in white, cyan and violet on a dark field.</desc>
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#121827"/>
      <stop offset="1" stop-color="#090d17"/>
    </linearGradient>
    <radialGradient id="aura">
      <stop stop-color="#50d4d4" stop-opacity=".28"/>
      <stop offset=".55" stop-color="#7b5dbc" stop-opacity=".13"/>
      <stop offset="1" stop-color="#7b5dbc" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="24" y="24" width="976" height="976" rx="224" fill="url(#field)"/>
  <rect x="25" y="25" width="974" height="974" rx="223" fill="none" stroke="#a6c8da" stroke-opacity=".15" stroke-width="2"/>
  <circle cx="512" cy="512" r="390" fill="url(#aura)"/>
  <circle cx="512" cy="512" r="325" fill="none" stroke="#6ee7e6" stroke-opacity=".13" stroke-width="2"/>
  <circle cx="512" cy="512" r="294" fill="none" stroke="#bd83f0" stroke-opacity=".10" stroke-width="2"/>
  <g transform="rotate(-8 512 512)">
    <rect x="302" y="302" width="180" height="180" rx="24" fill="#f1fcff"/>
    <rect x="542" y="302" width="180" height="180" rx="24" fill="#6ee7e6"/>
    <rect x="302" y="542" width="180" height="180" rx="24" fill="#bd83f0"/>
    <rect x="542" y="542" width="180" height="180" rx="24" fill="#f1fcff"/>
  </g>
</svg>
